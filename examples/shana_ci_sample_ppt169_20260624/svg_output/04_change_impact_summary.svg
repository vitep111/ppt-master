<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">

  <!-- Background -->
  <image href="../templates/images/bg_content.jpeg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>

  <!-- ── LOGO LOCKUP ─────────────────────────────────────────────────── -->
  <g id="logo-area">
    <image href="../templates/logo_pttep.png"      x="0"   y="0" width="154" height="40" preserveAspectRatio="xMinYMid meet"/>
    <image href="../templates/logo_digitalx.png"   x="193" y="2" width="108" height="48" preserveAspectRatio="xMinYMid meet"/>
    <image href="../templates/logo_shana_navy.png" x="312" y="5" width="167" height="32" preserveAspectRatio="xMinYMid meet"/>
  </g>

  <!-- ── PAGE TITLE ─────────────────────────────────────────────────── -->
  <g id="page-header">
    <text x="60" y="86"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="28" font-weight="bold" fill="#1B1164">Change Impact Summary</text>
    <rect x="60" y="100" width="1160" height="2" fill="#00AEEF"/>
  </g>

  <!-- ── KPI COLUMNS ────────────────────────────────────────────────── -->
  <g id="kpi-columns">

    <!-- Column backgrounds -->
    <rect x="60"  y="112" width="373" height="556" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="453" y="112" width="374" height="556" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="847" y="112" width="373" height="556" fill="#FFFFFF" fill-opacity="0.85"/>

    <!-- Column vertical dividers -->
    <line x1="433" y1="130" x2="433" y2="648" stroke="#D5D5D5" stroke-width="1"/>
    <line x1="827" y1="130" x2="827" y2="648" stroke="#D5D5D5" stroke-width="1"/>

    <!-- ── COL 1: 15 Impacted Business Processes ── -->
    <g id="kpi-col-1">
      <!-- Accent bar -->
      <rect x="60" y="112" width="373" height="6" fill="#00AEEF"/>

      <!-- KPI number -->
      <text x="246" y="214" text-anchor="middle"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="80" font-weight="bold" fill="#1B1164">15</text>

      <!-- Label -->
      <text x="246" y="250" text-anchor="middle"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="16" font-weight="bold" fill="#1B1164">Impacted Business</text>
      <text x="246" y="272" text-anchor="middle"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="16" font-weight="bold" fill="#1B1164">Processes</text>

      <!-- Teal rule -->
      <rect x="166" y="290" width="160" height="2" fill="#3BBF92"/>

      <!-- Sub-items -->
      <text x="90" y="322"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" fill="#5E5E5E">&#8226;&#160; T&amp;E claims submission</text>
      <text x="90" y="348"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" fill="#5E5E5E">&#8226;&#160; Expense approval routing</text>
      <text x="90" y="374"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" fill="#5E5E5E">&#8226;&#160; Cost centre coding</text>
      <text x="90" y="400"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" fill="#5E5E5E">&#8226;&#160; Month-end close</text>
      <text x="90" y="426"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" fill="#5E5E5E">&#8226;&#160; AP reconciliation</text>
      <text x="90" y="456"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#00AEEF">+ 10 additional processes</text>
    </g>

    <!-- ── COL 2: 3 Systems Decommissioned ── -->
    <g id="kpi-col-2">
      <!-- Accent bar -->
      <rect x="453" y="112" width="374" height="6" fill="#C00000"/>

      <!-- KPI number -->
      <text x="640" y="214" text-anchor="middle"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="80" font-weight="bold" fill="#C00000">3</text>

      <!-- Label -->
      <text x="640" y="250" text-anchor="middle"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="16" font-weight="bold" fill="#1B1164">Systems</text>
      <text x="640" y="272" text-anchor="middle"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="16" font-weight="bold" fill="#1B1164">Decommissioned</text>

      <!-- Red rule -->
      <rect x="560" y="290" width="160" height="2" fill="#C00000"/>

      <!-- Sub-items -->
      <text x="483" y="322"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" fill="#5E5E5E">&#8226;&#160; E-Payment Portal</text>
      <text x="483" y="348"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" fill="#5E5E5E">&#8226;&#160; SAP ECC Finance module</text>
      <text x="483" y="374"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" fill="#5E5E5E">&#8226;&#160; Manual Excel CO tracker</text>

      <!-- Supporting note -->
      <rect x="483" y="410" width="334" height="60" rx="4" fill="#C00000" fill-opacity="0.06"/>
      <text x="500" y="434"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#C00000" font-weight="bold">Data migration required</text>
      <text x="500" y="456"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#5E5E5E">Historical records to be archived</text>
    </g>

    <!-- ── COL 3: 480 End Users to Train ── -->
    <g id="kpi-col-3">
      <!-- Accent bar -->
      <rect x="847" y="112" width="373" height="6" fill="#3BBF92"/>

      <!-- KPI number -->
      <text x="1033" y="214" text-anchor="middle"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="80" font-weight="bold" fill="#3BBF92">480</text>

      <!-- Label -->
      <text x="1033" y="250" text-anchor="middle"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="16" font-weight="bold" fill="#1B1164">End Users</text>
      <text x="1033" y="272" text-anchor="middle"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="16" font-weight="bold" fill="#1B1164">to Train</text>

      <!-- Teal rule -->
      <rect x="953" y="290" width="160" height="2" fill="#3BBF92"/>

      <!-- Sub-items with mini bars -->
      <!-- Finance team 120 -->
      <text x="877" y="322"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" fill="#5E5E5E">Finance team</text>
      <text x="1170" y="322" text-anchor="end"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" font-weight="bold" fill="#1B1164">120</text>
      <rect x="877" y="330" width="283" height="6" rx="3" fill="#D5D5D5"/>
      <rect x="877" y="330" width="71" height="6" rx="3" fill="#1B1164"/>

      <!-- T&amp;E requestors 340 -->
      <text x="877" y="364"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" fill="#5E5E5E">T&amp;E requestors</text>
      <text x="1170" y="364" text-anchor="end"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" font-weight="bold" fill="#1B1164">340</text>
      <rect x="877" y="372" width="283" height="6" rx="3" fill="#D5D5D5"/>
      <rect x="877" y="372" width="200" height="6" rx="3" fill="#00AEEF"/>

      <!-- AP clerks 20 -->
      <text x="877" y="406"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" fill="#5E5E5E">AP clerks</text>
      <text x="1170" y="406" text-anchor="end"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" font-weight="bold" fill="#1B1164">20</text>
      <rect x="877" y="414" width="283" height="6" rx="3" fill="#D5D5D5"/>
      <rect x="877" y="414" width="12" height="6" rx="3" fill="#3BBF92"/>
    </g>

  </g>

  <!-- ── BOTTOM CALLOUT ─────────────────────────────────────────────── -->
  <g id="bottom-callout">
    <rect x="60" y="650" width="1160" height="2" fill="#00AEEF"/>
    <text x="640" y="672" text-anchor="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="14" fill="#1B1164" font-weight="bold">Impact spans Finance, T&amp;E, and CO sub-teams across HQ and all field locations</text>
  </g>

  <!-- ── FOOTER ─────────────────────────────────────────────────────────── -->
  <g id="footer">
    <text x="778" y="697"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="8" fill="#000000">Copyright &#169; 2026 Accenture. All rights reserved. Accenture Confidential Information</text>
    <text x="1215" y="697" text-anchor="end"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="10" fill="#000000">4</text>
  </g>

</svg>
