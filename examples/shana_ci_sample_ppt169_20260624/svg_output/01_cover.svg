<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">

  <!-- Background -->
  <image href="../templates/images/bg_cover.jpeg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>

  <!-- ── LOGO LOCKUP: top-left, larger (cover variant) ─────────────────── -->
  <g id="logo-area">
    <image href="../templates/logo_pttep.png"          x="0"   y="2"  width="255" height="66" preserveAspectRatio="xMinYMid meet"/>
    <image href="../templates/logo_digitalx.png"       x="319" y="0"  width="193" height="85" preserveAspectRatio="xMinYMid meet"/>
    <image href="../templates/logo_shana_gradient.png" x="510" y="12" width="254" height="48" preserveAspectRatio="xMinYMid meet"/>
  </g>

  <!-- ── TITLE BLOCK ──────────────────────────────────────────────────── -->
  <g id="title-block">
    <!-- Cyan accent bar left of title -->
    <rect x="120" y="270" width="6" height="120" fill="#00AEEF"/>

    <!-- Main title -->
    <text x="138" y="318"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="42" font-weight="bold" fill="#1B1164">Change Impact Analysis</text>

    <!-- Subtitle -->
    <text x="138" y="372"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="22" font-weight="normal" fill="#2A6FA0">Finance &amp; Travel and Expense Workstream</text>

    <!-- Teal rule under subtitle -->
    <rect x="138" y="392" width="480" height="3" fill="#3BBF92"/>

    <!-- Date / version line -->
    <text x="138" y="572"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="18" fill="#1B1164">June 2026&#160;&#160;|&#160;&#160;v0.1&#160;&#160;|&#160;&#160;Internal Review</text>
  </g>

  <!-- ── FOOTER ─────────────────────────────────────────────────────────── -->
  <g id="cover-footer">
    <text x="640" y="706" text-anchor="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="8" fill="#000000">Copyright &#169; 2026 Accenture. All rights reserved. Accenture Confidential Information</text>
  </g>

</svg>
