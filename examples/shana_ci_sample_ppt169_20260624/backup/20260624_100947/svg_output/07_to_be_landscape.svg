<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">

  <!-- Background -->
  <image href="../templates/images/bg_content.jpeg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>

  <!-- ── LOGO LOCKUP ─────────────────────────────────────────────────── -->
  <g id="logo-area">
    <image href="../templates/logo_pttep.png"      x="0"   y="0" width="154" height="40" preserveAspectRatio="xMinYMid meet"/>
    <image href="../templates/logo_digitalx.png"   x="193" y="2" width="108" height="48" preserveAspectRatio="xMinYMid meet"/>
    <image href="../templates/logo_shana_navy.png" x="312" y="5" width="167" height="32" preserveAspectRatio="xMinYMid meet"/>
  </g>

  <!-- ── PAGE TITLE ─────────────────────────────────────────────────── -->
  <g id="page-header">
    <text x="60" y="86"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="28" font-weight="bold" fill="#1B1164">To-Be System Landscape</text>
    <rect x="60" y="100" width="1160" height="2" fill="#00AEEF"/>
  </g>

  <!-- ── COLUMN HEADERS ─────────────────────────────────────────────── -->
  <g id="column-headers">
    <!-- As-Is column header -->
    <rect x="60" y="112" width="530" height="36" fill="#5E5E5E" fill-opacity="0.15"/>
    <text x="325" y="136" text-anchor="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="14" font-weight="bold" fill="#5E5E5E">AS-IS</text>

    <!-- Arrow column header (centre) -->
    <rect x="598" y="112" width="84" height="36" fill="#1B1164" fill-opacity="0.08"/>

    <!-- To-Be column header -->
    <rect x="690" y="112" width="530" height="36" fill="#1B1164" fill-opacity="0.12"/>
    <text x="955" y="136" text-anchor="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="14" font-weight="bold" fill="#1B1164">TO-BE</text>
  </g>

  <!-- ── CONTENT ROWS ────────────────────────────────────────────────── -->
  <g id="content-rows">

    <!-- ── Row 1: Core Finance ERP ── -->
    <g id="row-1">
      <!-- As-Is cell -->
      <rect x="60" y="148" width="530" height="110" fill="#FFFFFF" fill-opacity="0.8"/>
      <rect x="60" y="148" width="4" height="110" fill="#C00000"/>
      <text x="76" y="178"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="15" font-weight="bold" fill="#1B1164">SAP ECC 6.0</text>
      <text x="76" y="200"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#5E5E5E">Core GL, AP, AR &#183; 140 Finance users</text>
      <text x="76" y="222"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#5E5E5E">Manual month-end close &#183; 5-day cycle</text>
      <text x="76" y="244"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#C00000" font-weight="bold">Decommission by Sep 2026</text>

      <!-- Arrow -->
      <use data-icon="tabler-filled/arrow-big-right" x="606" y="183" width="68" height="44" fill="#1B1164" fill-opacity="0.35"/>

      <!-- To-Be cell -->
      <rect x="690" y="148" width="530" height="110" fill="#FFFFFF" fill-opacity="0.9"/>
      <rect x="690" y="148" width="4" height="110" fill="#3BBF92"/>
      <text x="706" y="178"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="15" font-weight="bold" fill="#1B1164">SAP S/4HANA</text>
      <text x="706" y="200"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#5E5E5E">Universal Journal &#183; Fiori UX &#183; 140 Finance users</text>
      <text x="706" y="222"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#5E5E5E">Automated close &#183; Target 2-day cycle</text>
      <text x="706" y="244"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#3BBF92" font-weight="bold">Go-Live Oct 2026</text>

