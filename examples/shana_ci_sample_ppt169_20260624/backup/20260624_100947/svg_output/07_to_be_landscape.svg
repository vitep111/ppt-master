    </g>

    <!-- ── Row 4: Integration layer (new) ── -->
    <g id="row-4">
      <!-- As-Is cell (n/a) -->
      <rect x="60" y="481" width="530" height="90" fill="#F5F5F5" fill-opacity="0.6"/>
      <text x="325" y="534" text-anchor="middle"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="14" fill="#5E5E5E" font-style="italic">No integration layer</text>

      <!-- Arrow -->
