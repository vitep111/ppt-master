  <!-- ── TABLE BORDER ───────────────────────────────────────────────── -->
  <rect x="60" y="148" width="1160" height="423" fill="none" stroke="#D5D5D5" stroke-width="1"/>

  <!-- ── LEGEND ────────────────────────────────────────────────────────── -->
  <g id="legend">
    <rect x="60" y="582" width="14" height="14" fill="#C00000"/>
    <text x="82" y="594"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="12" fill="#5E5E5E">Decommissioned</text>
    <rect x="230" y="582" width="14" height="14" fill="#3BBF92"/>
    <text x="252" y="594"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="12" fill="#5E5E5E">New / Upgraded</text>
    <rect x="400" y="582" width="14" height="14" fill="#00AEEF"/>
    <text x="422" y="594"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="12" fill="#5E5E5E">New Capability</text>
  </g>

  <!-- ── FOOTER ─────────────────────────────────────────────────────────── -->
  <g id="footer">
    <text x="778" y="697"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="8" fill="#000000">Copyright &#169; 2026 Accenture. All rights reserved. Accenture Confidential Information</text>
    <text x="1215" y="697" text-anchor="end"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="10" fill="#000000">7</text>
  </g>

</svg>
