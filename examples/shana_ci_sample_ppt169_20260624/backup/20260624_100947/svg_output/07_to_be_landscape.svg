      <text x="76" y="311"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#5E5E5E">Parallel systems &#183; 340 requestors</text>
      <text x="76" y="333"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#5E5E5E">Manual paper approval &#183; HQ only</text>
      <text x="76" y="355"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#C00000" font-weight="bold">Both decommissioned</text>

      <!-- Arrow -->
      <use data-icon="tabler-filled/arrow-big-right" x="606" y="294" width="68" height="44" fill="#1B1164" fill-opacity="0.35"/>

      <!-- To-Be cell -->
      <rect x="690" y="259" width="530" height="110" fill="#F5F5F5" fill-opacity="0.9"/>
      <rect x="690" y="259" width="4" height="110" fill="#3BBF92"/>
      <text x="706" y="289"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="15" font-weight="bold" fill="#1B1164">SAP Concur (upgraded)</text>
      <text x="706" y="311"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#5E5E5E">Mobile app &#183; All-staff &#183; 340 requestors</text>
      <text x="706" y="333"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#5E5E5E">Digital approval &#183; Field + HQ coverage</text>
      <text x="706" y="355"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#3BBF92" font-weight="bold">Go-Live Aug 2026</text>

      <!-- Row separator -->
      <line x1="60" y1="369" x2="1220" y2="369" stroke="#D5D5D5" stroke-width="1"/>
    </g>

    <!-- ── Row 3: CO Tracker ── -->
