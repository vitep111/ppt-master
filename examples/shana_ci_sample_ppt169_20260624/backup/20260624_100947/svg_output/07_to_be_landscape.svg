      <rect x="60" y="370" width="4" height="110" fill="#C00000"/>
      <text x="76" y="400"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="15" font-weight="bold" fill="#1B1164">Manual Excel CO Tracker</text>
      <text x="76" y="422"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#5E5E5E">Shadow tool &#183; CO team 20 users</text>
      <text x="76" y="444"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#5E5E5E">No ECC integration &#183; error-prone</text>
      <text x="76" y="466"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#C00000" font-weight="bold">Decommission by Aug 2026</text>

      <!-- Arrow -->
      <use data-icon="tabler-filled/arrow-big-right" x="606" y="405" width="68" height="44" fill="#1B1164" fill-opacity="0.35"/>

      <!-- To-Be cell -->
