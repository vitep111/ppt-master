      <rect x="690" y="481" width="4" height="90" fill="#00AEEF"/>
      <text x="706" y="511"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="15" font-weight="bold" fill="#1B1164">Integration Middleware</text>
      <text x="706" y="533"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#5E5E5E">SAP BTP / API Hub &#183; Concur &#8660; S/4HANA sync</text>
      <text x="706" y="555"
            font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="13" fill="#00AEEF" font-weight="bold">New capability</text>

    </g>
