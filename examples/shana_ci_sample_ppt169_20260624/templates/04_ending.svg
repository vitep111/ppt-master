<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Thank-you background: cyan wave dots top + bottom, white center band -->
  <image href="images/bg_thankyou.jpeg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>

  <!-- ── LOGO LOCKUP: top-left, navy (PTTEP | DigitalX | SHANA navy) ─────────── -->
  <image href="logo_pttep.png"      x="0"   y="0" width="154" height="40" preserveAspectRatio="xMinYMid meet"/>
  <image href="logo_digitalx.png"   x="193" y="2" width="108" height="48" preserveAspectRatio="xMinYMid meet"/>
  <image href="logo_shana_navy.png" x="312" y="5" width="167" height="32" preserveAspectRatio="xMinYMid meet"/>

  <!-- ── CENTERED CLOSING BLOCK ────────────────────────────────────────────── -->
  <text x="640" y="358" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="bold" fill="#1B1164">{{CLOSING_TITLE}}</text>

  <!-- Teal accent rule -->
  <rect x="540" y="376" width="200" height="3" fill="#3BBF92"/>

  <!-- Tagline -->
  <text x="640" y="424" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="20" fill="#000000">{{TAGLINE}}</text>

  <!-- Contact / URL -->
  <text x="640" y="460" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="15" fill="#00AEEF">{{CONTACT}}</text>

  <!-- ── FOOTER ─────────────────────────────────────────────────────────────── -->
  <text x="640" y="706" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="8" fill="#000000">Copyright © {{YEAR}} Accenture. All rights reserved. Accenture Confidential Information</text>
</svg>
