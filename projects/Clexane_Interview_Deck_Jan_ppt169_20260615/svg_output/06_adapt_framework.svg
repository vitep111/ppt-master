<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="sm-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.07" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Arrowhead markers -->
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#AE232F"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
    <marker id="ah-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B6900"/>
    </marker>
  </defs>

  <!-- ========== BACKGROUND ========== -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- ========== HEADER BAR ========== -->
  <rect x="0" y="0" width="1280" height="78" fill="#AE232F"/>
  <rect x="28" y="18" width="32" height="32" rx="6" fill="#8A1B25"/>
  <text x="44" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">06</text>
  <text x="78" y="44" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">My Selling Approach — The Sales Process</text>
  <text x="78" y="64" font-family="Arial, sans-serif" font-size="13" fill="#F9E5E7">Opening · Probing · Presentation · Closing — backed by Pre-Call Preparation and Post-Call Analysis</text>

  <!-- ========== PRE-CALL PREPARATION OVAL (yellow, top-left) ========== -->
  <ellipse cx="192" cy="118" rx="152" ry="34" fill="#FFD700" filter="url(#sm-shadow)"/>
  <text x="192" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5A3A00">Pre-Call</text>
  <text x="192" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5A3A00">Preparation</text>

  <!-- Dashed arrow: Pre-Call Preparation → Opening box -->
  <line x1="344" y1="118" x2="521" y2="133" stroke="#8B6900" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ah-gold)"/>

  <!-- ========== OPENING BOX ========== -->
  <rect x="525" y="104" width="230" height="60" rx="8" fill="#AE232F" filter="url(#sm-shadow)"/>
  <use data-icon="tabler-filled/user" x="540" y="119" width="22" height="22" fill="#FFFFFF"/>
  <text x="654" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Opening</text>
  <text x="654" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F9E5E7">Build rapport · Set agenda · Gain permission</text>

  <!-- Main flow arrow: Opening → Probing -->
  <line x1="640" y1="164" x2="640" y2="192" stroke="#AE232F" stroke-width="2.5" marker-end="url(#ah-red)"/>

  <!-- ========== PROBING BOX ========== -->
  <rect x="525" y="194" width="230" height="72" rx="8" fill="#AE232F" filter="url(#sm-shadow)"/>
  <use data-icon="tabler-filled/search" x="540" y="212" width="22" height="22" fill="#FFFFFF"/>
  <text x="654" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Probing</text>
  <text x="654" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F9E5E7">Open questions · Discover physician needs</text>
  <text x="654" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F9E5E7">Understand current prescribing behavior</text>

  <!-- ========== CYCLE ARROWS: Probing ↔ Presentation ========== -->
  <!-- LEFT arrow DOWN: Probing → Presentation (forward pass, left side) -->
  <path d="M 525,258 C 468,258 468,326 525,326"
        fill="none" stroke="#AE232F" stroke-width="2.2" marker-end="url(#ah-red)"/>
  <!-- RIGHT arrow UP: Presentation → Probing (cycle back, right side) -->
  <path d="M 755,326 C 812,326 812,258 755,258"
        fill="none" stroke="#AE232F" stroke-width="2.2" marker-end="url(#ah-red)"/>
  <!-- Cycle direction labels -->
  <text x="452" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-style="italic" fill="#AE232F">forward</text>
  <text x="828" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-style="italic" fill="#AE232F">back</text>

  <!-- ========== PRESENTATION BOX ========== -->
  <rect x="525" y="326" width="230" height="72" rx="8" fill="#AE232F" filter="url(#sm-shadow)"/>
  <use data-icon="tabler-filled/flask" x="540" y="344" width="22" height="22" fill="#FFFFFF"/>
  <text x="654" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Presentation</text>
  <text x="654" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F9E5E7">Evidence-based detailing · Feature-Benefit</text>
  <text x="654" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F9E5E7">Clinical data matched to physician need</text>

  <!-- Main flow arrow: Presentation → Closing -->
  <line x1="640" y1="398" x2="640" y2="424" stroke="#AE232F" stroke-width="2.5" marker-end="url(#ah-red)"/>

  <!-- ========== CLOSING BOX ========== -->
  <rect x="525" y="426" width="230" height="60" rx="8" fill="#AE232F" filter="url(#sm-shadow)"/>
  <use data-icon="tabler-filled/circle-check" x="540" y="441" width="22" height="22" fill="#FFFFFF"/>
  <text x="654" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Closing</text>
  <text x="654" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F9E5E7">Tie down commitment · Agree next step</text>

  <!-- ========== OBJECTIONS CLOUD (gray, left) ========== -->
  <!-- Cloud: overlapping ellipses + circles to create cloud silhouette -->
  <ellipse cx="175" cy="318" rx="108" ry="40" fill="#CCCCCC"/>
  <circle cx="107" cy="296" r="30" fill="#CCCCCC"/>
  <circle cx="150" cy="278" r="34" fill="#CCCCCC"/>
  <circle cx="202" cy="275" r="30" fill="#CCCCCC"/>
  <circle cx="246" cy="287" r="26" fill="#CCCCCC"/>
  <!-- Objections text -->
  <text x="175" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333">Objections</text>
  <text x="175" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555555">Physician pushback</text>
  <text x="175" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555555">during the call</text>

  <!-- Dashed arrow: Objections → left cycle area -->
  <line x1="281" y1="293" x2="464" y2="293" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ah-gray)"/>

  <!-- ========== QUESTIONS CLOUD (gray, right) ========== -->
  <ellipse cx="1105" cy="318" rx="108" ry="40" fill="#CCCCCC"/>
  <circle cx="1173" cy="296" r="30" fill="#CCCCCC"/>
  <circle cx="1130" cy="278" r="34" fill="#CCCCCC"/>
  <circle cx="1078" cy="275" r="30" fill="#CCCCCC"/>
  <circle cx="1034" cy="287" r="26" fill="#CCCCCC"/>
  <!-- Questions text -->
  <text x="1105" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333">Questions</text>
  <text x="1105" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555555">Physician enquiry</text>
  <text x="1105" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555555">seeking more data</text>

  <!-- Dashed arrow: Questions cloud → right cycle area -->
  <line x1="1001" y1="293" x2="816" y2="293" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ah-gray)"/>

  <!-- ========== POST-CALL ANALYSIS OVAL (yellow, bottom-right) ========== -->
  <ellipse cx="1085" cy="456" rx="152" ry="34" fill="#FFD700" filter="url(#sm-shadow)"/>
  <text x="1085" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5A3A00">Post-Call</text>
  <text x="1085" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5A3A00">Analysis</text>

  <!-- Dashed arrow: Closing → Post-Call oval -->
  <line x1="755" y1="456" x2="933" y2="456" stroke="#8B6900" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ah-gold)"/>

  <!-- ========== COMMUNICATION SKILLS BOX (bottom-left) ========== -->
  <rect x="40" y="506" width="242" height="82" rx="8" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.5" filter="url(#sm-shadow)"/>
  <rect x="40" y="506" width="242" height="5" rx="3" fill="#AE232F"/>
  <use data-icon="tabler-filled/message" x="58" y="524" width="26" height="26" fill="#AE232F"/>
  <text x="96" y="530" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Communication Skills</text>
  <text x="96" y="547" font-family="Arial, sans-serif" font-size="11" fill="#555555">Active listening · Empathy</text>
  <text x="96" y="562" font-family="Arial, sans-serif" font-size="11" fill="#555555">Non-verbal cues · Trust-building</text>
  <text x="58" y="582" font-family="Arial, sans-serif" font-size="10" fill="#AE232F" font-style="italic">Foundation underlying every stage of the call</text>

  <!-- ========== BOTTOM INSIGHT BAR ========== -->
  <rect x="36" y="606" width="1208" height="58" rx="6" fill="#AE232F" filter="url(#sm-shadow)"/>
  <use data-icon="tabler-filled/star" x="54" y="618" width="20" height="20" fill="#FFFFFF"/>
  <text x="84" y="628" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Key insight:</text>
  <text x="168" y="628" font-family="Arial, sans-serif" font-size="12" fill="#F9E5E7">Pre-Call Preparation and Post-Call Analysis are what separate average MRs from great ones.</text>
  <text x="84" y="650" font-family="Arial, sans-serif" font-size="12" fill="#F9E5E7">Probing and Presentation are not linear — they cycle until the physician's need is fully addressed and all objections are resolved.</text>

  <!-- ========== FOOTER ========== -->
  <g id="footer">
    <rect x="0" y="682" width="1280" height="38" fill="#AE232F"/>
    <text x="640" y="706" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Rattanakorn Rattanaroj  |  Rattanaroj.jan@gmail.com  |  080-045-0821</text>
  </g>
</svg>
