<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="80" y="52" width="44" height="4" rx="2" fill="#D97757"/>
    <text x="80" y="100" font-family="&quot;Styrene A&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="32" font-weight="700" fill="#191919">From raw source to finished artifact</text>
    <text x="80" y="130" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748B" letter-spacing="2">06 · SPOTLIGHT — ONE AGENT CARRIES THE ANALYSIS END TO END</text>
  </g>

  <g id="parent-container">
    <rect x="80" y="170" width="1140" height="430" rx="12" fill="#F8FAFC" fill-opacity="0.6" stroke="#D97757" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.5"/>
    <text x="650" y="198" text-anchor="middle" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D97757" letter-spacing="1.5">ENTERPRISE KNOWLEDGE WORK · INPUT: RAW SOURCE MATERIAL → OUTPUT: SHIPPABLE DELIVERABLE</text>
  </g>

  <g id="module-finance">
    <rect x="110" y="222" width="250" height="340" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="110" y="242" width="5" height="40" rx="2.5" fill="#D97757"/>
    <use data-icon="tabler-outline/chart-bar" x="134" y="246" width="30" height="30" fill="#D97757" stroke-width="2"/>
    <text x="134" y="316" font-family="&quot;Styrene A&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#191919">Financial analysis</text>
    <rect x="134" y="332" width="202" height="28" rx="6" fill="#F8FAFC"/>
    <text x="235" y="351" text-anchor="middle" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D97757">Benchmark-leading</text>
    <circle cx="140" cy="396" r="3.5" fill="#D97757"/>
    <text x="152" y="401" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919">Models &amp; valuations</text>
    <text x="152" y="420" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" fill="#64748B">DCFs, scenarios, sensitivity runs</text>
    <circle cx="140" cy="456" r="3.5" fill="#D97757"/>
    <text x="152" y="461" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919">Audit support</text>
    <text x="152" y="480" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" fill="#64748B">Tie-outs and exception hunting</text>
    <circle cx="140" cy="516" r="3.5" fill="#D97757"/>
    <text x="152" y="521" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919">Top finance scores</text>
    <text x="152" y="540" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" fill="#64748B">Leads public finance benchmarks</text>
  </g>

  <g id="module-documents">
    <rect x="397" y="222" width="250" height="340" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="397" y="242" width="5" height="40" rx="2.5" fill="#D97757"/>
    <use data-icon="tabler-outline/file-text" x="421" y="246" width="30" height="30" fill="#D97757" stroke-width="2"/>
    <text x="421" y="316" font-family="&quot;Styrene A&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#191919">Documents &amp; decks</text>
    <rect x="421" y="332" width="202" height="28" rx="6" fill="#F8FAFC"/>
    <text x="522" y="351" text-anchor="middle" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D97757">Artifacts, not drafts</text>
    <circle cx="427" cy="396" r="3.5" fill="#D97757"/>
    <text x="439" y="401" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919">Spreadsheets &amp; slides</text>
    <text x="439" y="420" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" fill="#64748B">Working xlsx, pptx, docx output</text>
    <circle cx="427" cy="456" r="3.5" fill="#D97757"/>
    <text x="439" y="461" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919">Formatted reports</text>
    <text x="439" y="480" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" fill="#64748B">Layout and styling included</text>
    <circle cx="427" cy="516" r="3.5" fill="#D97757"/>
    <text x="439" y="521" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919">Visual self-checks</text>
    <text x="439" y="540" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" fill="#64748B">Inspects its own rendered pages</text>
  </g>

  <g id="module-research">
    <rect x="684" y="222" width="250" height="340" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="684" y="242" width="5" height="40" rx="2.5" fill="#D97757"/>
    <use data-icon="tabler-outline/search" x="708" y="246" width="30" height="30" fill="#D97757" stroke-width="2"/>
    <text x="708" y="316" font-family="&quot;Styrene A&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#191919">Research synthesis</text>
    <rect x="708" y="332" width="202" height="28" rx="6" fill="#F8FAFC"/>
    <text x="809" y="351" text-anchor="middle" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D97757">1M-token reading</text>
    <circle cx="714" cy="396" r="3.5" fill="#D97757"/>
    <text x="726" y="401" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919">Multi-source verification</text>
    <text x="726" y="420" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" fill="#64748B">Cross-checks claims across inputs</text>
    <circle cx="714" cy="456" r="3.5" fill="#D97757"/>
    <text x="726" y="461" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919">Long-document digestion</text>
    <text x="726" y="480" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" fill="#64748B">Whole data rooms in one window</text>
    <circle cx="714" cy="516" r="3.5" fill="#D97757"/>
    <text x="726" y="521" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919">Cited conclusions</text>
    <text x="726" y="540" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" fill="#64748B">Findings traceable to sources</text>
  </g>

  <g id="module-legal">
    <rect x="971" y="222" width="250" height="340" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="971" y="242" width="5" height="40" rx="2.5" fill="#D97757"/>
    <use data-icon="tabler-outline/scale" x="995" y="246" width="30" height="30" fill="#D97757" stroke-width="2"/>
    <text x="995" y="316" font-family="&quot;Styrene A&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#191919">Legal review</text>
    <rect x="995" y="332" width="202" height="28" rx="6" fill="#F8FAFC"/>
    <text x="1096" y="351" text-anchor="middle" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D97757">Production scale</text>
    <circle cx="1001" cy="396" r="3.5" fill="#D97757"/>
    <text x="1013" y="401" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919">Contract review</text>
    <text x="1013" y="420" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" fill="#64748B">Clause-level risk surfacing</text>
    <circle cx="1001" cy="456" r="3.5" fill="#D97757"/>
    <text x="1013" y="461" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919">Document discovery</text>
    <text x="1013" y="480" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" fill="#64748B">Sifting large corpora for signal</text>
    <circle cx="1001" cy="516" r="3.5" fill="#D97757"/>
    <text x="1013" y="521" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919">Consistent judgment</text>
    <text x="1013" y="540" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12" fill="#64748B">Same rubric on file 1 and file 10,000</text>
  </g>

  <g id="takeaway-band">
    <text x="650" y="640" text-anchor="middle" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="15" fill="#191919">One agent, one context — <tspan font-weight="bold" fill="#D97757">no hand-offs between analysis and production</tspan>.</text>
  </g>

  <g id="footer">
    <text x="80" y="692" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="11" fill="#94A3B8">Source: Anthropic launch announcement; early-access partner workloads</text>
    <text x="1200" y="692" text-anchor="end" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="11" fill="#94A3B8">10</text>
  </g>
</svg>
