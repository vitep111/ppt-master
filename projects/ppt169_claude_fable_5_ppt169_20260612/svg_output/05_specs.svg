<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="80" y="52" width="44" height="4" rx="2" fill="#D97757"/>
    <text x="80" y="100" font-family="&quot;Styrene A&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="32" font-weight="700" fill="#191919">Frontier scale, predictable economics</text>
    <text x="80" y="130" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748B" letter-spacing="2">03 · SPECS AT A GLANCE — LESS THAN HALF THE PRICE OF MYTHOS PREVIEW</text>
  </g>

  <g id="kpi-context">
    <rect x="80" y="168" width="360" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="80" y="190" width="5" height="56" rx="2.5" fill="#D97757"/>
    <use data-icon="tabler-outline/database" x="108" y="196" width="34" height="34" fill="#D97757" stroke-width="2"/>
    <text x="108" y="272" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#64748B">Context window</text>
    <text x="108" y="330" font-family="&quot;Styrene A&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="50" font-weight="700" fill="#191919" letter-spacing="-1">1M <tspan font-size="20" font-weight="normal" fill="#64748B">tokens</tspan></text>
    <text x="108" y="362" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" fill="#94A3B8">Default and maximum</text>
  </g>

  <g id="kpi-output">
    <rect x="470" y="168" width="360" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="470" y="190" width="5" height="56" rx="2.5" fill="#D97757"/>
    <use data-icon="tabler-outline/bolt" x="498" y="196" width="34" height="34" fill="#D97757" stroke-width="2"/>
    <text x="498" y="272" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#64748B">Max output</text>
    <text x="498" y="330" font-family="&quot;Styrene A&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="50" font-weight="700" fill="#191919" letter-spacing="-1">128K <tspan font-size="20" font-weight="normal" fill="#64748B">tokens</tspan></text>
    <text x="498" y="362" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" fill="#94A3B8">Per request, streaming</text>
  </g>

  <g id="kpi-pricing">
    <rect x="860" y="168" width="360" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="860" y="190" width="5" height="56" rx="2.5" fill="#D97757"/>
    <use data-icon="tabler-outline/coin" x="888" y="196" width="34" height="34" fill="#D97757" stroke-width="2"/>
    <text x="888" y="272" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#64748B">Pricing per MTok</text>
    <text x="888" y="330" font-family="&quot;Styrene A&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="50" font-weight="700" fill="#191919" letter-spacing="-1">$10 <tspan font-size="20" font-weight="normal" fill="#64748B">in</tspan> <tspan fill="#D97757">$50</tspan> <tspan font-size="20" font-weight="normal" fill="#64748B">out</tspan></text>
    <text x="888" y="362" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" fill="#94A3B8">Flat — no long-context premium</text>
  </g>

  <g id="kpi-platforms">
    <rect x="80" y="418" width="360" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="80" y="440" width="5" height="56" rx="2.5" fill="#D97757"/>
    <use data-icon="tabler-outline/world" x="108" y="446" width="34" height="34" fill="#D97757" stroke-width="2"/>
    <text x="108" y="522" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#64748B">Platforms at GA</text>
    <text x="108" y="580" font-family="&quot;Styrene A&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="50" font-weight="700" fill="#191919" letter-spacing="-1">5</text>
    <text x="108" y="612" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" fill="#94A3B8">Claude API · AWS · Bedrock · Vertex · Foundry</text>
  </g>

  <g id="kpi-launch">
    <rect x="470" y="418" width="360" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="470" y="440" width="5" height="56" rx="2.5" fill="#D97757"/>
    <use data-icon="tabler-outline/calendar-event" x="498" y="446" width="34" height="34" fill="#D97757" stroke-width="2"/>
    <text x="498" y="522" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#64748B">Generally available</text>
    <text x="498" y="580" font-family="&quot;Styrene A&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="50" font-weight="700" fill="#191919" letter-spacing="-1">Jun 9 <tspan font-size="20" font-weight="normal" fill="#64748B">2026</tspan></text>
    <text x="498" y="612" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" fill="#94A3B8">API immediately; subscriptions staged to Jun 23</text>
  </g>

  <g id="kpi-retention">
    <rect x="860" y="418" width="360" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="860" y="440" width="5" height="56" rx="2.5" fill="#D97757"/>
    <use data-icon="tabler-outline/lock" x="888" y="446" width="34" height="34" fill="#D97757" stroke-width="2"/>
    <text x="888" y="522" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#64748B">Data retention</text>
    <text x="888" y="580" font-family="&quot;Styrene A&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="50" font-weight="700" fill="#191919" letter-spacing="-1">30 <tspan font-size="20" font-weight="normal" fill="#64748B">days</tspan></text>
    <text x="888" y="612" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="13" fill="#94A3B8">Covered Model — not available under ZDR</text>
  </g>

  <g id="footer">
    <text x="80" y="692" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="11" fill="#94A3B8">Source: platform.claude.com — Introducing Claude Fable 5 and Claude Mythos 5</text>
    <text x="1200" y="692" text-anchor="end" font-family="&quot;Anthropic Sans&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="11" fill="#94A3B8">05</text>
  </g>
</svg>
